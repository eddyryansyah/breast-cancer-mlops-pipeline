name: MLOps Pipeline CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mlproject/requirements.txt
          pip install -r monitoring/requirements.txt
          pip install -r tests/requirements.txt

      - name: Run automated tests
        run: |
          python -m pytest tests -v

  train-and-build-docker:
    needs: test
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write

    env:
      DOCKER_IMAGE_NAME: breast-cancer-mlops-pipeline
      GHCR_REGISTRY: ghcr.io
      GHCR_IMAGE_NAME: ${{ github.repository }}
      HF_SPACE_REPO: eddyryansyah/breast-cancer-mlops-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mlproject/requirements.txt
          pip install huggingface_hub

      - name: Run MLflow Project
        run: |
          mlflow run mlproject --env-manager=local

      - name: Find logged MLflow model
        id: find_model
        run: |
          MODEL_PATH=$(find . -path "*/artifacts/model/MLmodel" | head -n 1 | sed 's#/MLmodel$##')

          if [ -z "$MODEL_PATH" ]; then
            echo "MLflow model artifact not found"
            exit 1
          fi

          echo "MODEL_PATH=$MODEL_PATH" >> $GITHUB_ENV
          echo "Found model path: $MODEL_PATH"

      - name: Prepare Hugging Face Space files
        run: |
          rm -rf hf_space_deploy
          mkdir -p hf_space_deploy/data/processed

          cp app/app.py hf_space_deploy/app.py
          cp app/requirements.txt hf_space_deploy/requirements.txt
          cp app/README.md hf_space_deploy/README.md
          cp data/processed/breast_cancer_preprocessing.csv hf_space_deploy/data/processed/breast_cancer_preprocessing.csv
          cp -R "$MODEL_PATH" hf_space_deploy/model

          find hf_space_deploy -maxdepth 3 -type f -print

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mlflow-training-artifacts
          path: |
            mlruns
            mlproject/mlruns

      - name: Build Docker image with MLflow
        run: |
          mlflow models build-docker \
            --model-uri "$MODEL_PATH" \
            --name "$DOCKER_IMAGE_NAME" \
            --env-manager local

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Hub image
        if: github.event_name != 'pull_request'
        run: |
          docker tag "$DOCKER_IMAGE_NAME:latest" "${{ secrets.DOCKERHUB_USERNAME }}/$DOCKER_IMAGE_NAME:latest"

      - name: Push Docker Hub image
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/$DOCKER_IMAGE_NAME:latest"

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag GHCR image
        if: github.event_name != 'pull_request'
        run: |
          docker tag "$DOCKER_IMAGE_NAME:latest" "$GHCR_REGISTRY/$GHCR_IMAGE_NAME:latest"

      - name: Push GHCR image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$GHCR_REGISTRY/$GHCR_IMAGE_NAME:latest"

      - name: Deploy to Hugging Face Space
        if: github.event_name != 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload "$HF_SPACE_REPO" hf_space_deploy . \
            --repo-type space \
            --commit-message "Deploy canonical MLflow model from GitHub Actions"
